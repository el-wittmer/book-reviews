name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Install and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check index.js

      # Replace the syntax check with `npm test` after adding a real test suite.

  deploy:
    name: Deploy after CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
    uses: ./.github/workflows/deploy_to_aws.yaml
    secrets: inherit
